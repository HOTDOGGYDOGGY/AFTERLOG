<!doctype html>
<html lang="ko" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="역극 기록을 원문과 함께 보관하고 편집·내보내는 도구" />
    <title>AFTERLOG · 애프터로그</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%2320232a'/><text x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'>A</text></svg>" />
    <script>
      // 저장된 앱 테마를 그리기 전에 적용(깜빡임 방지). 신규 기본은 다크
      try {
        var m = localStorage.getItem("afterlog.appTheme");
        if (!m && localStorage.getItem("afterlog.editorTheme") === "light") m = "light";
        if (m === "light" || (m === "system" && matchMedia("(prefers-color-scheme: light)").matches)) document.documentElement.setAttribute("data-theme", "light");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
