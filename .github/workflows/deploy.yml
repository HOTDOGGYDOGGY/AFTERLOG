# AFTERLOG를 GitHub Pages에 배포한다.
# main에 변경이 올라오면(또는 Actions 탭에서 수동 실행하면) 테스트 → 빌드 → 배포.
# 저장소 Settings → Pages → Source를 "GitHub Actions"로 한 번 설정해야 동작한다.
name: Deploy AFTERLOG to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      # 수집 확장도 빌드해서 사이트에서 받을 수 있게 한다(dist/afterlog-collector.zip)
      - run: npm run build:collector
      - run: cd dist-collector && zip -qr ../dist/afterlog-collector.zip .
      # 로컬 실행판(서버 없이 index.html을 파일로 여는 판): dist/afterlog-local.zip
      - run: npm run build:local
      - run: cd dist-local && zip -qr ../dist/afterlog-local.zip .
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
